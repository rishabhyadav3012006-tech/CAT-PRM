services:
  # 1. CareNest API Backend Service
  - type: web
    name: carenest-backend
    env: node
    plan: starter
    region: ohio
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: carenest-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: carenest-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: https://carenest.vercel.app,https://carenest-frontend.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: VAULT_HMAC_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: CareNest Health <noreply@carenest.health>
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # 2. Managed Redis for BullMQ Healthcare Schedulers
  - type: redis
    name: carenest-redis
    region: ohio
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: carenest-postgres
    region: ohio
    plan: starter
    databaseName: carenest_db
    user: carenest_admin

